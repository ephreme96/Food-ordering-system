<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Staff Login — Taste of Ethiopia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=DM+Sans:wght@300;400;500;600;700&family=Noto+Sans+Ethiopic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: {
        fontFamily: {
          sans:    ['"DM Sans"', 'sans-serif'],
          display: ['"Playfair Display"', 'serif'],
        },
      }}
    }
  </script>
  <style>
    * { font-family: 'DM Sans', sans-serif; }
    .font-display { font-family: 'Playfair Display', serif; }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50%       { transform: translateY(-20px); }
    }
    @keyframes shimmer {
      0%   { background-position: -200% center; }
      100% { background-position:  200% center; }
    }

    .anim-1 { animation: slideUp 0.6s cubic-bezier(0.16,1,0.3,1) both; }
    .anim-2 { animation: slideUp 0.6s 0.1s cubic-bezier(0.16,1,0.3,1) both; }
    .anim-3 { animation: slideUp 0.6s 0.2s cubic-bezier(0.16,1,0.3,1) both; }

    .orb-1 { animation: float 9s ease-in-out infinite; }
    .orb-2 { animation: float 12s 2s ease-in-out infinite; }
    .orb-3 { animation: float 7s 4s ease-in-out infinite; }

    .glass-card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .glass-input {
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: white;
      transition: border-color 0.2s ease, background 0.2s ease;
      font-size: 15px;
    }
    .glass-input::placeholder { color: rgba(255,255,255,0.25); }
    .glass-input:focus {
      outline: none;
      border-color: rgba(200,16,46,0.6);
      background: rgba(255,255,255,0.1);
      box-shadow: 0 0 0 3px rgba(200,16,46,0.12);
    }

    .btn-signin {
      background: #C8102E;
      color: white;
      font-weight: 600;
      letter-spacing: 0.01em;
      transition: all 0.15s ease;
    }
    .btn-signin:hover { background: #a80d26; transform: translateY(-1px); box-shadow: 0 8px 24px rgba(200,16,46,0.35); }
    .btn-signin:active { transform: scale(0.97) translateY(0); }
    .btn-signin:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }

    .brand-shimmer {
      background: linear-gradient(90deg, #fff 0%, #D4A017 40%, #fff 60%, #fff 100%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: shimmer 4s linear infinite;
    }

    @media (prefers-reduced-motion: reduce) {
      *, ::before, ::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }

    /* ── Language toggle ── */
    .lang-toggle {
      display: flex;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.13);
      border-radius: 999px;
      overflow: hidden;
      font-size: .7rem;
      font-weight: 700;
      cursor: pointer;
    }
    .lang-toggle span {
      padding: .3rem .65rem;
      transition: background .15s, color .15s;
      color: rgba(255,255,255,.4);
      cursor: pointer;
      user-select: none;
    }
    .lang-toggle span.active {
      background: #C8102E;
      color: #fff;
      border-radius: 999px;
    }
    body.lang-am { font-family: 'Noto Sans Ethiopic', 'DM Sans', sans-serif; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 relative overflow-hidden" style="background: #0D0D0D;">

  <!-- Language toggle -->
  <div class="absolute top-4 right-4 z-20">
    <div class="lang-toggle" role="group" aria-label="Language selector">
      <span id="langEN" class="active" onclick="setLanguage('en')">EN</span>
      <span id="langAM" onclick="setLanguage('am')">አማ</span>
    </div>
  </div>

  <!-- Subtle warm background gradient -->
  <div class="absolute inset-0 pointer-events-none" style="background: radial-gradient(ellipse 80% 60% at 50% 0%, rgba(200,16,46,0.08) 0%, transparent 60%);"></div>

  <!-- Background orbs -->
  <div class="orb-1 absolute top-[-8%] left-[-4%] w-96 h-96 rounded-full pointer-events-none" style="background: radial-gradient(circle, rgba(200,16,46,0.12) 0%, transparent 70%);"></div>
  <div class="orb-2 absolute bottom-[-5%] right-[-5%] w-80 h-80 rounded-full pointer-events-none" style="background: radial-gradient(circle, rgba(212,160,23,0.1) 0%, transparent 70%);"></div>
  <div class="orb-3 absolute top-[45%] right-[8%] w-64 h-64 rounded-full pointer-events-none" style="background: radial-gradient(circle, rgba(22,163,74,0.06) 0%, transparent 70%);"></div>

  <div class="w-full max-w-md relative z-10">

    <!-- Brand -->
    <div class="text-center mb-8 anim-1">
      <!-- Red brand icon -->
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl mb-5" style="background: #C8102E; box-shadow: 0 8px 32px rgba(200,16,46,0.4);">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-7 h-7 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.042A8.967 8.967 0 006 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 016 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 016-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0118 18a8.967 8.967 0 00-6 2.292m0-14.25v14.25" />
        </svg>
      </div>
      <h1 class="font-display text-3xl font-bold brand-shimmer mb-1">Taste of Ethiopia</h1>
      <p class="text-sm font-medium" style="color: rgba(255,255,255,0.35);" data-i18n="brand.sub">Staff Portal</p>
    </div>

    <!-- Card -->
    <div class="glass-card rounded-2xl p-8 anim-2">
      <h2 class="text-lg font-semibold text-white mb-1" data-i18n="form.welcome">Welcome back</h2>
      <p class="text-sm mb-6" style="color:rgba(255,255,255,0.4);" data-i18n="form.sub">Sign in to access your dashboard</p>

      <div id="errorMsg" class="hidden mb-5 p-3.5 rounded-xl text-sm font-medium" style="background: rgba(200,16,46,0.15); border: 1px solid rgba(200,16,46,0.3); color: #fca5a5;"></div>

      <form id="loginForm" class="space-y-4" autocomplete="off">
        <div>
          <label class="block text-sm font-medium mb-2" style="color: rgba(255,255,255,0.6);" data-i18n="form.username">Username</label>
          <input id="username" type="text" required autocomplete="username"
            class="glass-input w-full px-4 py-3 rounded-xl"
            placeholder="e.g. kitchen_staff" data-i18n-placeholder="form.username_ph" />
        </div>
        <div>
          <label class="block text-sm font-medium mb-2" style="color: rgba(255,255,255,0.6);" data-i18n="form.password">Password</label>
          <div class="relative">
            <input id="password" type="password" required autocomplete="current-password"
              class="glass-input w-full px-4 py-3 rounded-xl pr-12"
              placeholder="••••••••" />
            <button type="button" onclick="togglePwd()" class="absolute inset-y-0 right-0 flex items-center px-3.5 cursor-pointer" style="color: rgba(255,255,255,0.35);" onmouseover="this.style.color='rgba(255,255,255,0.75)'" onmouseout="this.style.color='rgba(255,255,255,0.35)'">
              <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
              </svg>
            </button>
          </div>
        </div>
        <div class="pt-2">
          <button type="submit" id="submitBtn" class="btn-signin w-full py-3.5 rounded-xl flex items-center justify-center gap-2 cursor-pointer text-base">
            <span id="btnText" data-i18n="btn.signin">Sign In</span>
            <svg id="spinner" class="hidden animate-spin h-4 w-4" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
            </svg>
          </button>
        </div>
      </form>

      <div class="mt-6 pt-5" style="border-top: 1px solid rgba(255,255,255,0.07);">
        <a href="/" class="flex items-center justify-center gap-1.5 text-sm font-medium cursor-pointer transition-colors" style="color: rgba(255,255,255,0.35);" onmouseover="this.style.color='rgba(255,255,255,0.75)'" onmouseout="this.style.color='rgba(255,255,255,0.35)'">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
          </svg>
          <span data-i18n="link.back">Back to Customer Ordering</span>
        </a>
      </div>
    </div>

    <!-- Credentials hint -->
    <div class="mt-4 rounded-xl p-4 text-xs anim-3" style="background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06);">
      <p class="font-semibold mb-2" style="color: rgba(255,255,255,0.4);" data-i18n="hint.title">Default accounts (change after setup)</p>
      <div class="space-y-1.5" style="color: rgba(255,255,255,0.25);">
        <p>Admin: <code class="px-1.5 py-0.5 rounded text-xs" style="background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.55);">admin</code> / <code class="px-1.5 py-0.5 rounded text-xs" style="background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.55);">Admin@1234</code></p>
        <p>Kitchen: <code class="px-1.5 py-0.5 rounded text-xs" style="background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.55);">kitchen_staff</code> / <code class="px-1.5 py-0.5 rounded text-xs" style="background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.55);">Kitchen@1234</code></p>
        <p>Cashier: <code class="px-1.5 py-0.5 rounded text-xs" style="background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.55);">cashier1</code> / <code class="px-1.5 py-0.5 rounded text-xs" style="background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.55);">Cashier@1234</code></p>
      </div>
    </div>
  </div>

<script>
  const API = window.location.origin;

  // ── Translations ──────────────────────────────────────────────────────────────
  const TRANSLATIONS = {
    en: {
      'brand.sub':      'Staff Portal',
      'form.welcome':   'Welcome back',
      'form.sub':       'Sign in to access your dashboard',
      'form.username':  'Username',
      'form.username_ph': 'e.g. kitchen_staff',
      'form.password':  'Password',
      'btn.signin':     'Sign In',
      'btn.signing_in': 'Signing in…',
      'link.back':      'Back to Customer Ordering',
      'hint.title':     'Default accounts (change after setup)',
      'err.login':      'Login failed',
      'err.network':    'Network error — is the server running?',
    },
    am: {
      'brand.sub':      'የሰራተኛ ፖርታል',
      'form.welcome':   'እንኳን ደህና ተመለሱ',
      'form.sub':       'ዳሽቦርድዎን ለማግኘት ይግቡ',
      'form.username':  'የተጠቃሚ ስም',
      'form.username_ph': 'ለምሳሌ፦ kitchen_staff',
      'form.password':  'የምስጢር ቃል',
      'btn.signin':     'ግቡ',
      'btn.signing_in': 'እየገቡ ነው…',
      'link.back':      'ወደ ደንበኛ ትዕዛዝ ተመለሱ',
      'hint.title':     'ነባሪ መለያዎች (ከጀማሪ በኋላ ይቀይሩ)',
      'err.login':      'መግቢያ አልተሳካም',
      'err.network':    'የአውታረ መረብ ስህተት — አገልጋዩ ይሰራ ይሆን?',
    },
  };

  let currentLang = localStorage.getItem('lang') || 'en';

  function t(key) {
    return (TRANSLATIONS[currentLang] || TRANSLATIONS.en)[key] ?? TRANSLATIONS.en[key] ?? key;
  }

  function applyTranslations() {
    document.querySelectorAll('[data-i18n]').forEach(el => {
      el.textContent = t(el.dataset.i18n);
    });
    document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
      el.placeholder = t(el.dataset.i18nPlaceholder);
    });
    document.documentElement.lang = currentLang === 'am' ? 'am' : 'en';
    document.body.classList.toggle('lang-am', currentLang === 'am');
    document.getElementById('langEN').classList.toggle('active', currentLang === 'en');
    document.getElementById('langAM').classList.toggle('active', currentLang === 'am');
  }

  function setLanguage(lang) {
    if (lang === currentLang) return;
    currentLang = lang;
    localStorage.setItem('lang', lang);
    applyTranslations();
  }

  // ── Init ──────────────────────────────────────────────────────────────────────
  applyTranslations();

  // ── Utilities ─────────────────────────────────────────────────────────────────
  function togglePwd() {
    const p = document.getElementById('password');
    p.type = p.type === 'password' ? 'text' : 'password';
  }

  function showError(msg) {
    const el = document.getElementById('errorMsg');
    el.textContent = msg;
    el.classList.remove('hidden');
  }

  function setLoading(loading) {
    document.getElementById('spinner').classList.toggle('hidden', !loading);
    document.getElementById('submitBtn').disabled = loading;
    document.getElementById('btnText').textContent = loading ? t('btn.signing_in') : t('btn.signin');
  }

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    document.getElementById('errorMsg').classList.add('hidden');
    setLoading(true);

    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;

    try {
      const res = await fetch(`${API}/api/auth/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password }),
      });

      const data = await res.json();

      if (!res.ok) {
        showError(data.detail || t('err.login'));
        return;
      }

      localStorage.setItem('token', data.access_token);
      localStorage.setItem('user', JSON.stringify(data.user));

      const role = data.user.role;
      const redirectMap = {
        admin:    '/frontend/admin.html',
        kitchen:  '/frontend/kitchen.html',
        cashier:  '/cashier-pos',
        customer: '/frontend/customer.html',
      };
      window.location.href = redirectMap[role] || '/frontend/customer.html';

    } catch (err) {
      showError(t('err.network'));
    } finally {
      setLoading(false);
    }
  });
</script>
</body>
</html>
